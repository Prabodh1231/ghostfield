name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      # To add a second app later: build it too, then copy each dist into one
      # folder (e.g. site/ and site/<app>/) and upload that folder instead.
      - run: pnpm --filter wifi-deadzone build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/wifi-deadzone/dist
      - id: deployment
        uses: actions/deploy-pages@v4
