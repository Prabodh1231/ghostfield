name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter wifi-deadzone build
      - run: pnpm --filter bass-ghost-finder build
      - run: |
          mkdir -p site/bass
          cp -r apps/wifi-deadzone/dist/. site/
          cp -r apps/bass-ghost-finder/dist/. site/bass/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
