name: CI
on:
  pull_request:
jobs:
  physics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - name: Test 6 (CFL guard, ETD)
        run: pnpm --filter ghostfield-core exec vitest run tests/test6-cfl-etd.test.ts --pool=forks --poolOptions.forks.singleFork
      - name: Test 7 (room modes)
        run: pnpm --filter ghostfield-core exec vitest run tests/test7-room-modes.test.ts --pool=forks --poolOptions.forks.singleFork --testTimeout=300000
      - name: Test 1 (energy)
        run: pnpm --filter ghostfield-core exec vitest run tests/test1-energy.test.ts --pool=forks --poolOptions.forks.singleFork --testTimeout=300000
      - name: Test 2 (reciprocity)
        run: pnpm --filter ghostfield-core exec vitest run tests/test2-reciprocity.test.ts --pool=forks --poolOptions.forks.singleFork --testTimeout=300000
      - name: Test 3 (mirror symmetry)
        run: pnpm --filter ghostfield-core exec vitest run tests/test3-mirror.test.ts --pool=forks --poolOptions.forks.singleFork --testTimeout=300000
      - name: Test 4 (2D spreading)
        run: pnpm --filter ghostfield-core exec vitest run tests/test4-spreading.test.ts --pool=forks --poolOptions.forks.singleFork --testTimeout=300000
      - name: Test 5 (CPML reflection)
        run: pnpm --filter ghostfield-core exec vitest run tests/test5-cpml-reflection.test.ts --pool=forks --poolOptions.forks.singleFork --testTimeout=300000
      - name: GPU parity (skips itself when there is no WebGPU adapter)
        run: pnpm --filter ghostfield-core exec vitest run tests/gpu-parity.test.ts --pool=forks --poolOptions.forks.singleFork --testTimeout=300000
      - name: GPU job vs CPU job (skips itself when there is no WebGPU adapter)
        run: pnpm --filter ghostfield-core exec vitest run tests/gpu-job.test.ts --pool=forks --poolOptions.forks.singleFork --testTimeout=300000
      - name: Wi-Fi app, material mapping test
        run: pnpm --filter wifi-deadzone exec vitest run tests/materials.test.ts --pool=forks --poolOptions.forks.singleFork
      - name: Wi-Fi app, wall shadow check (CPU solver, prints the numbers)
        run: pnpm --filter wifi-deadzone exec vitest run tests/shadow.test.ts --pool=forks --poolOptions.forks.singleFork --testTimeout=300000
      - name: Wi-Fi app, static build
        run: pnpm --filter wifi-deadzone build
